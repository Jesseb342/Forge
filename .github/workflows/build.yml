name: Build Forge iOS IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle identifier for the iOS app'
        required: false
        default: 'forge.cardforge.ios'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    name: RoboVM iOS Build (Unsigned IPA)
    env:
      APP_ID: ${{ github.event.inputs.bundle_id || 'forge.cardforge.ios' }}

    steps:
      # Step 1: Clone the official Forge repository at runtime
      - name: Checkout Official Forge Repository
        uses: actions/checkout@v4
        with:
          repository: 'Card-Forge/forge'
          ref: 'master'

      # Step 2: Set up Java JDK 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Step 3: Cache RoboVM SDK & AOT cache
      - name: Cache RoboVM SDK & AOT
        uses: actions/cache@v4
        with:
          path: ~/.robovm
          key: robovm-${{ runner.os }}-${{ hashFiles('forge-gui-ios/pom.xml') }}

      # Step 4: Execute the iOS Pipeline Build
      - name: Build Unsigned IPA
        run: |
          chmod +x forge-gui-ios/pipeline/ios-pipeline.sh
          SKIP_CACHE_CLEAR=1 bash forge-gui-ios/pipeline/ios-pipeline.sh ipa

      # Step 5: Upload the compiled .ipa artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-ios-unsigned-ipa
          path: forge-gui-ios/target/robovm/*.ipa
          if-no-files-found: error

